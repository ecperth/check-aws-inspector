name: test 'n build

on:
  pull_request:
    branches:
      - main
    types: 
      - opened
      - synchronize

jobs:
  test_n_build:
    name: test 'n build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{github.head_ref}}
      
      - name: run tests and bundle
        run: docker run --rm -v $(pwd):/app -w /app node:25.8.0-slim sh -c "npm install && npm run test && npm run bundle"
        
      - name: fail if bundle produces diff
        run: if ! git diff --quiet; then exit 1; fi